<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Math Worker —— 小学数学 1-6 年级互动式数学课堂" />
    <title>Math Worker · 小学数学互动课堂</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ef5'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' fill='white' text-anchor='middle'%3E%E2%88%91%3C/text%3E%3C/svg%3E"
    />
    <!-- 样式统一在 src/main.js 里 import，由 Vite 负责打包与热更新 -->
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="#/">
          <span class="brand-mark">∑</span>
          <span class="brand-text">
            <strong>Math Worker</strong>
            <small>小学数学互动课堂</small>
          </span>
        </a>
        <nav class="app-nav">
          <a class="app-nav-link" data-nav-link="home" href="#/">全部教材</a>
        </nav>
      </header>

      <!-- 路由视图挂载点；由 src/app/router.js 负责渲染 -->
      <main id="view" class="view" aria-live="polite"></main>

      <noscript>
        <p style="padding: 24px; text-align: center; color: #b4740a">
          这个页面需要 JavaScript 才能运行。
        </p>
      </noscript>

      <!-- 用浏览器直接双击打开 index.html 时，ES module 会被 file:// 的 CORS 规则拦掉，
           这里给一条明确提示，避免页面看起来"坏了"。 -->
      <script>
        if (location.protocol === 'file:') {
          var hint = document.createElement('div');
          hint.setAttribute(
            'style',
            'margin:48px auto;max-width:640px;padding:24px 28px;border:1px solid #e2e6f0;' +
              'border-radius:16px;background:#fff;font-family:system-ui,sans-serif;line-height:1.7;color:#1c2333',
          );
          hint.innerHTML =
            '<h2 style="margin:0 0 12px;font-size:20px">需要通过本地服务器打开</h2>' +
            '<p style="margin:0 0 8px;color:#5b6680">直接双击 index.html 时，浏览器会以 file:// 协议拦截 ES module 加载，页面无法运行。</p>' +
            '<p style="margin:0 0 8px">在项目目录执行：</p>' +
            '<pre style="margin:0;padding:12px 16px;border-radius:10px;background:#f0f3fa;font-family:Consolas,monospace">npm install\nnpm run dev</pre>' +
            '<p style="margin:12px 0 0;color:#5b6680">然后访问命令输出的地址（默认 http://localhost:5173）。</p>';
          document.querySelector('.view').replaceChildren(hint);
        }
      </script>

      <footer class="app-footer">
        <span>内容依据人教版小学数学教材</span>
        <span class="dot">·</span>
        <span>three.js 驱动</span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
